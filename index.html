<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Portfolio_Test</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #unity-canvas { width: 100%; height: 100%; display: block; outline: none; }
    #loader {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      background: #1a1a1a; color: #fff; font-family: system-ui, sans-serif;
      transition: opacity .4s;
    }
    #bar { width: 240px; height: 4px; background: #444; border-radius: 2px; overflow: hidden; }
    #fill { width: 0; height: 100%; background: #fff; transition: width .2s; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loader">
    <div>Chargement…</div>
    <div id="bar"><div id="fill"></div></div>
  </div>

  <script>
    var canvas = document.querySelector("#unity-canvas");
    var config = {
      dataUrl: "Build/Portfolio_Test_Build_3.data.unityweb",
      frameworkUrl: "Build/Portfolio_Test_Build_3.framework.js.unityweb",
      codeUrl: "Build/Portfolio_Test_Build_3.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Portfolio_Test",
      productVersion: "0.1.0"
    };

    var script = document.createElement("script");
    script.src = "Build/Portfolio_Test_Build_3.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        document.querySelector("#fill").style.width = (100 * progress) + "%";
      }).then(function () {
        var loader = document.querySelector("#loader");
        loader.style.opacity = 0;
        setTimeout(function () { loader.remove(); }, 400);
      }).catch(function (message) {
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
